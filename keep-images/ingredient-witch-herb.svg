<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="herbBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2114" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#05120a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d0b0e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70e000"/>
      <stop offset="45%" stop-color="#38b000"/>
      <stop offset="100%" stop-color="#004b23"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007200"/>
      <stop offset="55%" stop-color="#38b000"/>
      <stop offset="100%" stop-color="#9ef01a"/>
    </linearGradient>
    <radialGradient id="flowerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0aaff"/>
      <stop offset="40%" stop-color="#9d4edd"/>
      <stop offset="85%" stop-color="#3c096c"/>
      <stop offset="100%" stop-color="#10002b"/>
    </radialGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a6240"/>
      <stop offset="60%" stop-color="#543820"/>
      <stop offset="100%" stop-color="#2d1c0f"/>
    </linearGradient>
    <filter id="herbSporeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#herbBg)"/>

  <!-- Alchemical Circle -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#38b000" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="7,4"/>
  <circle cx="250" cy="250" r="195" fill="none" stroke="#c9a227" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="250" cy="250" r="175" fill="none" stroke="#70e000" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Earth Botanical Pentagram -->
  <polygon points="250,75 390,390 110,390" fill="none" stroke="#c9a227" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Roots -->
  <path d="M250,320 Q240,360 220,400 M250,330 Q265,370 280,395 M245,340 Q235,375 240,410 M252,335 Q260,365 255,405" stroke="url(#rootGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Main Stems -->
  <path d="M250,330 Q245,260 250,180 Q252,140 250,110" stroke="#2d6a4f" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M248,250 Q215,220 180,210" stroke="#2d6a4f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M250,220 Q285,190 320,180" stroke="#2d6a4f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M249,280 Q205,270 170,285" stroke="#2d6a4f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M251,270 Q290,260 325,275" stroke="#2d6a4f" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Leaves Left -->
  <path d="M180,210 Q145,185 160,165 Q195,175 220,205 Z" fill="url(#leafGrad1)" stroke="#52b788" stroke-width="1"/>
  <path d="M170,285 Q130,270 145,245 Q185,255 210,275 Z" fill="url(#leafGrad2)" stroke="#52b788" stroke-width="1"/>
  
  <!-- Leaves Right -->
  <path d="M320,180 Q355,155 340,135 Q305,145 280,175 Z" fill="url(#leafGrad2)" stroke="#52b788" stroke-width="1"/>
  <path d="M325,275 Q365,260 350,235 Q310,245 285,265 Z" fill="url(#leafGrad1)" stroke="#52b788" stroke-width="1"/>

  <!-- Central Top Leaves -->
  <path d="M250,140 Q215,110 230,85 Q260,105 250,140 Z" fill="url(#leafGrad1)" stroke="#52b788" stroke-width="1"/>
  <path d="M250,140 Q285,110 270,85 Q240,105 250,140 Z" fill="url(#leafGrad2)" stroke="#52b788" stroke-width="1"/>

  <!-- Nightshade Bell Blossoms -->
  <!-- Flower 1 (Center) -->
  <ellipse cx="250" cy="180" rx="22" ry="26" fill="url(#flowerGlow)" filter="url(#herbSporeGlow)"/>
  <circle cx="250" cy="182" r="7" fill="#ffeaa7"/>
  <circle cx="250" cy="182" r="3" fill="#ff7675"/>

  <!-- Flower 2 (Left) -->
  <ellipse cx="195" cy="225" rx="16" ry="20" fill="url(#flowerGlow)" transform="rotate(-20, 195, 225)"/>
  <circle cx="195" cy="225" r="5" fill="#ffeaa7"/>

  <!-- Flower 3 (Right) -->
  <ellipse cx="305" cy="210" rx="17" ry="22" fill="url(#flowerGlow)" transform="rotate(25, 305, 210)"/>
  <circle cx="305" cy="210" r="5" fill="#ffeaa7"/>

  <!-- Glowing Magical Spores -->
  <circle cx="225" cy="150" r="3.5" fill="#70e000" filter="url(#herbSporeGlow)"/>
  <circle cx="275" cy="155" r="4" fill="#9ef01a" filter="url(#herbSporeGlow)"/>
  <circle cx="180" cy="195" r="2.5" fill="#e0aaff" filter="url(#herbSporeGlow)"/>
  <circle cx="320" cy="170" r="3" fill="#ffeaa7" filter="url(#herbSporeGlow)"/>
  <circle cx="210" cy="305" r="2.5" fill="#52b788" filter="url(#herbSporeGlow)"/>
  <circle cx="290" cy="295" r="3" fill="#70e000" filter="url(#herbSporeGlow)"/>
  <circle cx="250" cy="360" r="2" fill="#ffeaa7" filter="url(#herbSporeGlow)"/>

  <!-- Twine around base -->
  <ellipse cx="250" cy="325" rx="14" ry="5" fill="none" stroke="#d4a373" stroke-width="3"/>
  <ellipse cx="250" cy="332" rx="15" ry="5" fill="none" stroke="#c99563" stroke-width="2.5"/>

  <!-- Label -->
  <text x="250" y="445" font-family="'Cinzel', serif" font-size="16" letter-spacing="4" fill="#70e000" text-anchor="middle" font-weight="600">WITCH'S HERB</text>
  <text x="250" y="465" font-family="'Cinzel', serif" font-size="10" letter-spacing="3" fill="rgba(233, 226, 208, 0.55)" text-anchor="middle">EARTH &amp; CRAFT</text>
</svg>
