<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="vampBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2b0a12" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#120306" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d0b0e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f8f9fa"/>
      <stop offset="70%" stop-color="#e9ecef"/>
      <stop offset="100%" stop-color="#adb5bd"/>
    </linearGradient>
    <linearGradient id="silverGothic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2eafc"/>
      <stop offset="50%" stop-color="#8da9c4"/>
      <stop offset="100%" stop-color="#3b4d61"/>
    </linearGradient>
    <radialGradient id="bloodDropGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff002b"/>
      <stop offset="60%" stop-color="#8a0017"/>
      <stop offset="100%" stop-color="#3d000a"/>
    </radialGradient>
    <filter id="vampGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#vampBg)"/>

  <!-- Alchemical Circle -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#d90429" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="250" cy="250" r="195" fill="none" stroke="#c9a227" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="250" cy="250" r="175" fill="none" stroke="#ef233c" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Blood Red Ritual Diamond -->
  <polygon points="250,65 425,250 250,435 75,250" fill="none" stroke="#d90429" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Bat Wing Silhouette / Arch in background -->
  <path d="M150,150 Q200,180 250,140 Q300,180 350,150 Q310,210 250,195 Q190,210 150,150 Z" fill="#38040e" fill-opacity="0.4"/>

  <!-- Gothic Silver Mounting Cap -->
  <path d="M190,140 C190,120 220,110 250,110 C280,110 310,120 310,140 L305,175 C290,185 270,190 250,190 C230,190 210,185 195,175 Z" fill="url(#silverGothic)" stroke="#2b2d42" stroke-width="2"/>
  
  <!-- Silver Filigree Details -->
  <circle cx="250" cy="145" r="9" fill="#1b263b" stroke="#c9a227" stroke-width="1.5"/>
  <circle cx="250" cy="145" r="4" fill="#d90429"/>
  <path d="M220,150 Q250,170 280,150" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Main Vampire Fang (Curved Sharp Canine) -->
  <path d="M198,175 C205,225 220,285 250,365 C265,285 292,225 302,175 C280,185 220,185 198,175 Z" fill="url(#ivoryGrad)" stroke="#c5d3e8" stroke-width="2"/>

  <!-- Fang Shadow/Ridge Curve -->
  <path d="M250,365 C235,285 218,225 210,178" fill="none" stroke="#adb5bd" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M250,365 C258,285 275,225 285,178" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Second Smaller Background Fang -->
  <path d="M165,160 C175,200 185,245 205,300 C212,250 225,205 230,165" fill="#ced4da" stroke="#8da9c4" stroke-width="1.5" fill-opacity="0.65"/>

  <!-- Glistening Ruby Drop of Blood at Tip -->
  <path d="M250,365 C244,385 238,400 250,412 C262,400 256,385 250,365 Z" fill="url(#bloodDropGlow)" filter="url(#vampGlow)"/>
  <circle cx="248" cy="402" r="2.5" fill="#ff758f"/>

  <!-- Blood Mist Tendrils -->
  <path d="M235,395 Q205,405 210,425" stroke="#ef233c" stroke-width="1.5" fill="none" stroke-linecap="round" filter="url(#vampGlow)"/>
  <path d="M265,395 Q295,405 290,425" stroke="#ef233c" stroke-width="1.5" fill="none" stroke-linecap="round" filter="url(#vampGlow)"/>

  <!-- Ambient Red Particles -->
  <circle cx="160" cy="260" r="2.5" fill="#ef233c" filter="url(#vampGlow)"/>
  <circle cx="340" cy="270" r="3" fill="#d90429" filter="url(#vampGlow)"/>
  <circle cx="310" cy="340" r="2" fill="#ff4d6d" filter="url(#vampGlow)"/>
  <circle cx="190" cy="350" r="2.5" fill="#d90429" filter="url(#vampGlow)"/>

  <!-- Label -->
  <text x="250" y="445" font-family="'Cinzel', serif" font-size="16" letter-spacing="4" fill="#ef233c" text-anchor="middle" font-weight="600">VAMPIRE FANG</text>
  <text x="250" y="465" font-family="'Cinzel', serif" font-size="10" letter-spacing="3" fill="rgba(233, 226, 208, 0.55)" text-anchor="middle">NIGHT &amp; HUNGER</text>
</svg>
