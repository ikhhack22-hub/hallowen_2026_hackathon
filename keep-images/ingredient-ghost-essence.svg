<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="ghostBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#051f24" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#020d0f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d0b0e" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="spiritGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#7bf1a8" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#06d6a0" stop-opacity="0.5"/>
      <stop offset="90%" stop-color="#118ab2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#073b4c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lanternBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6c554"/>
      <stop offset="50%" stop-color="#9a7b1c"/>
      <stop offset="100%" stop-color="#4d3b0a"/>
    </linearGradient>
    <filter id="spiritFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#ghostBg)"/>

  <!-- Alchemical Circle -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#06d6a0" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="250" cy="250" r="195" fill="none" stroke="#c9a227" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="250" cy="250" r="175" fill="none" stroke="#7bf1a8" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Spirit Aura -->
  <circle cx="250" cy="250" r="110" fill="url(#spiritGlow)" filter="url(#spiritFilter)"/>

  <!-- Ghost Lantern Cage -->
  <!-- Top Ring Handle -->
  <circle cx="250" cy="95" r="22" fill="none" stroke="url(#lanternBrass)" stroke-width="5"/>
  <!-- Lantern Roof -->
  <polygon points="250,115 310,155 190,155" fill="url(#lanternBrass)" stroke="#382905" stroke-width="2"/>
  <rect x="200" y="155" width="100" height="12" rx="2" fill="url(#lanternBrass)" stroke="#382905" stroke-width="1.5"/>

  <!-- Lantern Base -->
  <rect x="195" y="360" width="110" height="14" rx="3" fill="url(#lanternBrass)" stroke="#382905" stroke-width="2"/>
  <polygon points="205,374 295,374 310,395 190,395" fill="url(#lanternBrass)" stroke="#382905" stroke-width="2"/>

  <!-- Glass Chamber Body -->
  <path d="M205,167 L295,167 L305,360 L195,360 Z" fill="#082b2e" fill-opacity="0.5" stroke="#7bf1a8" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Cage Metal Struts -->
  <line x1="205" y1="167" x2="195" y2="360" stroke="url(#lanternBrass)" stroke-width="4"/>
  <line x1="295" y1="167" x2="305" y2="360" stroke="url(#lanternBrass)" stroke-width="4"/>
  <line x1="250" y1="167" x2="250" y2="360" stroke="url(#lanternBrass)" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Ethereal Spirit / Ghost Essence Inside -->
  <!-- Swirling phantom body -->
  <path d="M250,200 C275,200 285,225 275,255 C265,280 280,310 260,335 C245,355 235,325 240,295 C230,280 215,260 225,230 C235,205 240,200 250,200 Z" fill="#ffffff" fill-opacity="0.85" filter="url(#spiritFilter)"/>
  
  <!-- Spirit Eyes -->
  <ellipse cx="242" cy="235" rx="3.5" ry="5.5" fill="#022e33"/>
  <ellipse cx="258" cy="235" rx="3.5" ry="5.5" fill="#022e33"/>
  <ellipse cx="250" cy="250" rx="3" ry="5" fill="#022e33" fill-opacity="0.7"/>

  <!-- Wisps escaping -->
  <path d="M260,280 Q290,260 280,230" stroke="#7bf1a8" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#spiritFilter)"/>
  <path d="M235,290 Q210,270 220,240" stroke="#06d6a0" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#spiritFilter)"/>

  <!-- Floating Spirit Orbs -->
  <circle cx="150" cy="200" r="3" fill="#7bf1a8" filter="url(#spiritFilter)"/>
  <circle cx="350" cy="190" r="3.5" fill="#ffffff" filter="url(#spiritFilter)"/>
  <circle cx="340" cy="330" r="2.5" fill="#06d6a0" filter="url(#spiritFilter)"/>
  <circle cx="160" cy="320" r="3" fill="#7bf1a8" filter="url(#spiritFilter)"/>

  <!-- Label -->
  <text x="250" y="445" font-family="'Cinzel', serif" font-size="16" letter-spacing="4" fill="#06d6a0" text-anchor="middle" font-weight="600">GHOST ESSENCE</text>
  <text x="250" y="465" font-family="'Cinzel', serif" font-size="10" letter-spacing="3" fill="rgba(233, 226, 208, 0.55)" text-anchor="middle">SPIRIT &amp; SILENCE</text>
</svg>
